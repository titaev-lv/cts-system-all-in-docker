services:
  # 1. MySQL - общая БД
  mysql:
    image: mysql:9.4.0
    container_name: ct-system-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ct_system}
      #MYSQL_USER: ${MYSQL_USER:-root}
      #MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      TZ: ${TZ:-UTC}
    volumes:
      - ./volumes/mysql-data:/var/lib/mysql
      - ./volumes/mysql-dump:/mysql-dump
      - ./services/mysql/my.cnf:/etc/mysql/my.cnf:ro
      - ./volumes/pki/ca/ca.crt:/etc/mysql/ssl/ca/ca.crt:ro
      - ./volumes/pki/mysql/server/mysql.crt:/etc/mysql/ssl/server/mysql.server.crt:ro
      - ./volumes/pki/mysql/server/mysql.key:/etc/mysql/ssl/server/mysql.server.key:ro
      #- ./services/cts-core/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    networks:
      - cts-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    restart: unless-stopped

  # 2. HSM Service
  hsm:
    build:
      context: ./services/hsm-service
      dockerfile: Dockerfile
    container_name: ct-system-hsm
    volumes:
      - ./services/hsm-service/config.yaml:/app/config.yaml:ro
      - ./services/hsm-service/metadata.yaml:/app/metadata.yaml:ro
      - ./volumes/pki/ca/ca.crt:/app/pki/ca/ca.crt:ro
      - ./volumes/pki/hsm-service/server/hsm-service.crt:/app/pki/server/hsm-service.local.crt:ro
      - ./volumes/pki/hsm-service/server/hsm-service.key:/app/pki/server/hsm-service.local.key:ro
      - ./volumes/pki/revoked.yaml:/app/pki/revoked.yaml:ro
      - ./services/hsm-service/scripts:/app/scripts:ro
      - ./volumes/hsm-tokens:/var/lib/softhsm/tokens
    ports:
      - "8443:8443"
    networks:
      cts-net:
        aliases:
          - hsm-service
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f hsm-service || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # 3. Web UI (веб-интерфейс)
  web-ui:
    build:
      context: ./services/web-ui-go
      dockerfile: Dockerfile
    container_name: ct-system-web-ui
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/web-ui-go/config/config.yaml:/app/config/config.yaml:ro
      - ./services/web-ui-go/logs:/app/logs
      - ./volumes/pki/ca/ca.crt:/app/pki/ca/ca.crt:ro
      - ./volumes/pki/mysql/clients/web-ui/web-ui-mysql.crt:/app/pki/mysql/client.crt:ro
      - ./volumes/pki/mysql/clients/web-ui/web-ui-mysql.key:/app/pki/mysql/client.key:ro
      - ./volumes/pki/hsm-service/clients/web-ui-2fa/web-ui-hsm-2fa.crt:/app/pki/hsm/client.crt:ro
      - ./volumes/pki/hsm-service/clients/web-ui-2fa/web-ui-hsm-2fa.key:/app/pki/hsm/client.key:ro
      - ./volumes/pki/cts-core/clients/web-ui/web-ui-cts.crt:/app/pki/cts-core/client.crt:ro
      - ./volumes/pki/cts-core/clients/web-ui/web-ui-cts.key:/app/pki/cts-core/client.key:ro
      - ./volumes/pki/clickhouse/clients/web-ui/web-ui-clickhouse.crt:/app/pki/clickhouse/client.crt:ro
      - ./volumes/pki/clickhouse/clients/web-ui/web-ui-clickhouse.key:/app/pki/clickhouse/client.key:ro
    environment:
      - TZ=${TZ:-UTC}
      #- CT_DATABASE_MYSQL_HOST=ct-system-mysql
      #- CT_DATABASE_MYSQL_USER=${MYSQL_USER:-root}
      #- CT_DATABASE_MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      #- CT_DATABASE_MYSQL_DATABASE=${MYSQL_DATABASE:-ct_system}
    ports:
      - "80:80"
    networks:
      - cts-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    restart: unless-stopped

  # 4. CTS-Core (оркестратор)
  cts-core:
    build:
      context: ./services/cts-core
      dockerfile: Dockerfile
    container_name: ct-system-cts-core
    user: "0:0"
    depends_on:
      mysql:
        condition: service_healthy
      hsm:
        condition: service_healthy
    volumes:
      - ./services/cts-core/conf:/app/conf:ro
      - ./services/cts-core/logs:/app/logs
      - ./services/cts-core/state:/app/state
      - ./volumes/pki/ca/ca.crt:/app/pki/ca/ca.crt:ro
      - ./volumes/pki/cts-core/server/cts-core.crt:/app/pki/server/cts-core.crt:ro
      - ./volumes/pki/cts-core/server/cts-core.key:/app/pki/server/cts-core.key:ro
      - ./volumes/pki/mysql/clients/cts-core/cts-core-mysql.crt:/app/pki/mysql/client.crt:ro
      - ./volumes/pki/mysql/clients/cts-core/cts-core-mysql.key:/app/pki/mysql/client.key:ro
      - ./volumes/pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.crt:/app/pki/hsm/2fa/client.crt:ro
      - ./volumes/pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.key:/app/pki/hsm/2fa/client.key:ro
      - ./volumes/pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.crt:/app/pki/hsm/trader/client.crt:ro
      - ./volumes/pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.key:/app/pki/hsm/trader/client.key:ro
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "8080:8080"  # REST API (Phase 1.5+)
      - "8081:8081"  # WebSocket (Phase 2+)
    networks:
      - cts-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cts-core || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
    restart: unless-stopped

  # 5. Trader-1 (test)
  trader-1:
    build:
      context: ./services/trader-daemon
      dockerfile: Dockerfile
    container_name: ct-system-trader-1
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/trader-daemon/conf:/app/conf:ro
      - ./services/trader-daemon/logs:/app/logs
      - ./services/trader-daemon/state:/app/state
      - ./volumes/pki/ca/ca.crt:/app/pki/ca/ca.crt:ro
      - ./volumes/pki/hsm-service/clients/trader-1/trader-1-hsm.crt:/app/pki/hsm/client.crt:ro
      - ./volumes/pki/hsm-service/clients/trader-1/trader-1-hsm.key:/app/pki/hsm/client.key:ro
      - ./volumes/pki/cts-core/clients/trader-1/trader-1-cts.crt:/app/pki/cts-core/client.crt:ro
      - ./volumes/pki/cts-core/clients/trader-1/trader-1-cts.key:/app/pki/cts-core/client.key:ro
      - ./volumes/pki/clickhouse/clients/trader-1/trader-1-clickhouse.crt:/app/pki/clickhouse/client.crt:ro
      - ./volumes/pki/clickhouse/clients/trader-1/trader-1-clickhouse.key:/app/pki/clickhouse/client.key:ro
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "8082:8080"
    networks:
      - cts-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    restart: unless-stopped

