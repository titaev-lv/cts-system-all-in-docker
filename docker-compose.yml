services:
  # 1. MySQL - общая БД
  mysql:
    build:
      context: ./services/mysql
      dockerfile: Dockerfile
    container_name: ct-system-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ct_system}
      #MYSQL_USER: ${MYSQL_USER:-root}
      #MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      TZ: ${TZ:-UTC}
    volumes:
      - ./volumes/mysql-data:/var/lib/mysql
      - ./volumes/mysql-dump:/mysql-dump
      - ./services/mysql/my.cnf:/etc/mysql/my.cnf:ro
      - ./volumes/pki/ca/ca-chain.crt:/etc/mysql/ssl/ca.crt:ro
      - ./volumes/pki/mysql/server/mysql.crt:/etc/mysql/ssl/mysql.crt:ro
      - ./volumes/pki/mysql/server/mysql.key:/etc/mysql/ssl/mysql.key:ro
    ports:
      - "3306:3306"
    networks:
      - cts-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    restart: unless-stopped

  # 2. HSM Service
  hsm:
    build:
      context: ./services/hsm-service
      dockerfile: Dockerfile
    container_name: ct-system-hsm
    volumes:
      - ./services/hsm-service/config.yaml:/app/config.yaml:ro
      - ./services/hsm-service/metadata.yaml:/app/metadata.yaml:rw
      - ./services/hsm-service/revoked.yaml:/app/revoked.yaml:rw
      - ./volumes/pki/ca/ca.crt:/app/pki/ca/ca.crt:ro
      - ./volumes/pki/hsm-service/server/hsm-service.crt:/app/pki/server/hsm-service.crt:ro
      - ./volumes/pki/hsm-service/server/hsm-service.key:/app/pki/server/hsm-service.key:ro
      - ./services/hsm-service/scripts:/app/scripts:ro
      - ./volumes/hsm-tokens:/var/lib/softhsm/tokens
      - ./services/hsm-service/logs:/var/log/hsm-service
    ports:
      - "8443:8443"
    networks:
      cts-net:
        aliases:
          - hsm-service
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f hsm-service || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  # 3. Web UI (веб-интерфейс)
  web-ui:
    build:
      context: ./services/web-ui-go
      dockerfile: Dockerfile
    container_name: ct-system-web-ui
    user: "${WEB_UI_UID:-1001}:${WEB_UI_GID:-1001}"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./services/web-ui-go/config/config.yaml:/app/config/config.yaml:ro
      - ./volumes/pki/ca/ca.crt:/app/pki/ca/ca.crt:ro
      - ./volumes/pki/web-ui/server/web-ui.fullchain.crt:/app/pki/server/web-ui.fullchain.crt:ro
      - ./volumes/pki/web-ui/server/web-ui.key:/app/pki/server/web-ui.key:ro
      - ./volumes/pki/mysql/clients/web-ui/web-ui-mysql.crt:/app/pki/mysql/web-ui-mysql.crt:ro
      - ./volumes/pki/mysql/clients/web-ui/web-ui-mysql.key:/app/pki/mysql/web-ui-mysql.key:ro
      - ./services/web-ui-go/logs:/app/logs
    environment:
      - TZ=${TZ:-UTC}
      #- CT_DATABASE_MYSQL_HOST=ct-system-mysql
      #- CT_DATABASE_MYSQL_USER=${MYSQL_USER:-root}
      #- CT_DATABASE_MYSQL_PASSWORD=${MYSQL_PASSWORD:-root}
      #- CT_DATABASE_MYSQL_DATABASE=${MYSQL_DATABASE:-ct_system}
    networks:
      - cts-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f web-ui || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    restart: unless-stopped

  # 4. Nginx (reverse proxy + static)
  nginx:
    image: nginx:1.27-alpine
    container_name: ct-system-nginx
    depends_on:
      web-ui:
        condition: service_healthy
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/web-ui-go/web:/var/www/web-ui:ro
      - ./volumes/pki/web-ui/server/web-ui.fullchain.crt:/etc/nginx/ssl/web-ui.fullchain.crt:ro
      - ./volumes/pki/web-ui/server/web-ui.key:/etc/nginx/ssl/web-ui.key:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - cts-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    restart: unless-stopped

  # 5. CTS-Core (оркестратор)
  cts-core:
    build:
      context: ./services/cts-core
      dockerfile: Dockerfile
    container_name: ct-system-cts-core
    user: "${CTS_CORE_UID:-1001}:${CTS_CORE_GID:-1001}"
    depends_on:
      mysql:
        condition: service_healthy
      hsm:
        condition: service_healthy
    volumes:
      - ./services/cts-core/conf:/app/conf:ro
      - ./volumes/pki/ca/ca.crt:/app/pki/ca/ca.crt:ro
      - ./volumes/pki/cts-core/server/cts-core.crt:/app/pki/server/cts-core.crt:ro
      - ./volumes/pki/cts-core/server/cts-core.key:/app/pki/server/cts-core.key:ro
      - ./volumes/pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.crt:/app/pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.crt:ro
      - ./volumes/pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.key:/app/pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.key:ro
      - ./volumes/pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.crt:/app/pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.crt:ro
      - ./volumes/pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.key:/app/pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.key:ro
      - ./volumes/pki/mysql/clients/cts-core/cts-core-mysql.crt:/app/pki/client/cts-core-mysql.crt:ro
      - ./volumes/pki/mysql/clients/cts-core/cts-core-mysql.key:/app/pki/client/cts-core-mysql.key:ro
      - ./services/cts-core/logs:/app/logs
      - ./services/cts-core/state:/app/state
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "8080:8080"  # REST API (Phase 1.5+)
      - "8081:8081"  # WebSocket (Phase 2+)
    networks:
      - cts-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cts-core || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
    restart: unless-stopped

  # 6. Trader-1 (test)
  trader-1:
    build:
      context: ./services/trader
      dockerfile: Dockerfile
    container_name: ct-system-trader-1
    user: "${TRADER_UID:-1001}:${TRADER_GID:-1001}"
    depends_on:
      cts-core:
        condition: service_healthy
    volumes:
      - ./services/trader/conf:/app/conf:ro
      - ./services/trader/logs:/app/logs
      - ./services/trader/state:/app/state
    command: ["-c", "conf/config.yaml"]
    environment:
      - TZ=${TZ:-UTC}
      - TRADER_ORDERBOOK_DEBUG_LOG_RAW=false
      - TRADER_ORDERBOOK_DEBUG_LOG_MSG=false
      - TRADER_CLICKHOUSE_HOST=clickhouse
      - TRADER_CLICKHOUSE_PORT=8123
      - TRADER_CLICKHOUSE_DATABASE=crypto
      - TRADER_CLICKHOUSE_USERNAME=default
      - TRADER_CLICKHOUSE_PASSWORD=default
      - TRADER_CLICKHOUSE_USE_TLS=false
    networks:
      - cts-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    restart: unless-stopped

